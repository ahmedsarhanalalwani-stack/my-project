<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Pop Clone - Bubble Shooter</title>
    <style>
        /* --- CSS: التنسيق الجمالي --- */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a2a3a;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            border: 4px solid #34495e;
            border-radius: 15px;
            overflow: hidden;
            background: #a8e063; /* لون احتياطي */
        }

        canvas {
            display: block;
            /* خلفية متدرجة توحي بالغابة */
            background: linear-gradient(to bottom, #2d5a27 0%, #4a7c44 100%);
            cursor: crosshair;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.2);
        }

        .score-box {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #gameOver h2 { margin-top: 0; color: #e74c3c; }

        button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        button:hover { background: #2ecc71; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="ui-layer">
            <div class="score-box">النقاط: <span id="score">0</span></div>
        </div>
        
        <canvas id="gameCanvas"></canvas>

        <div id="gameOver">
            <h2>انتهت اللعبة!</h2>
            <p>لقد وصلت الفقاعات إلى النهاية.</p>
            <button onclick="resetGame()">إلعب مجدداً</button>
        </div>
    </div>

    <script>
        /* --- JavaScript: منطق اللعبة --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOver');

        canvas.width = 440;
        canvas.height = 640;

        const ROWS = 12;
        const COLS = 8;
        const RADIUS = 25;
        const COLORS = ['#FF4747', '#477BFF', '#47E647', '#FFD700', '#FF47B1'];

        let grid = [];
        let shooterBall = null;
        let isShooting = false;
        let score = 0;

        // 1. تهيئة الشبكة (Hex Grid)
        function initGrid() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    if (r < 6) { // ملء الصفوف العلوية عشوائياً
                        grid[r][c] = {
                            color: COLORS[Math.floor(Math.random() * COLORS.length)],
                            active: true
                        };
                    } else {
                        grid[r][c] = { active: false };
                    }
                }
            }
        }

        // حساب الموقع الفعلي لكل فقاعة في النظام السداسي
        function getCoords(r, c) {
            let x = c * RADIUS * 2 + RADIUS;
            if (r % 2 !== 0) x += RADIUS; // إزاحة الصفوف الفردية
            let y = r * RADIUS * 1.7 + RADIUS;
            return { x, y };
        }

        // 2. كائن الكرة المنطلقة
        class Projectile {
            constructor(x, y, color, angle) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speed = 12;
                this.dx = Math.cos(angle) * this.speed;
                this.dy = Math.sin(angle) * this.speed;
            }

            draw() {
                drawBubble(this.x, this.y, this.color);
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;

                // الارتداد من الجدران الجانبية
                if (this.x - RADIUS < 0 || this.x + RADIUS > canvas.width) {
                    this.dx *= -1;
                }
            }
        }

        function drawBubble(x, y, color) {
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(x, y, RADIUS - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            // إضافة لمعة بسيطة للفقاعة
            ctx.beginPath();
            ctx.arc(x - RADIUS/3, y - RADIUS/3, RADIUS/4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 3. كشف التصادم والالتصاق بالشبكة
        function checkCollision() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].active) {
                        const { x, y } = getCoords(r, c);
                        const dist = Math.hypot(shooterBall.x - x, shooterBall.y - y);
                        if (dist < RADIUS * 1.7) {
                            snapToGrid();
                            return;
                        }
                    }
                }
            }
            if (shooterBall.y - RADIUS < 0) snapToGrid();
        }

        function snapToGrid() {
            let bestR = 0, bestC = 0, minDist = Infinity;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const { x, y } = getCoords(r, c);
                    const d = Math.hypot(shooterBall.x - x, shooterBall.y - y);
                    if (d < minDist) {
                        minDist = d;
                        bestR = r;
                        bestC = c;
                    }
                }
            }

            grid[bestR][bestC] = { color: shooterBall.color, active: true };
            
            // التحقق من الخسارة
            if (bestR >= ROWS - 1) {
                gameOverScreen.style.display = 'block';
                return;
            }

            findMatches(bestR, bestC);
            isShooting = false;
            createShooter();
        }

        // 4. خوارزمية البحث عن الألوان المتطابقة (Flood Fill)
        function findMatches(r, c) {
            const targetColor = grid[r][c].color;
            const matches = [[r, c]];
            const queue = [[r, c]];
            const visited = new Set([`${r},${c}`]);

            while (queue.length > 0) {
                const [currR, currC] = queue.shift();
                const neighbors = getNeighbors(currR, currC);

                for (const [nR, nC] of neighbors) {
                    if (nR >= 0 && nR < ROWS && nC >= 0 && nC < COLS) {
                        const cell = grid[nR][nC];
                        if (cell.active && cell.color === targetColor && !visited.has(`${nR},${nC}`)) {
                            visited.add(`${nR},${nC}`);
                            matches.push([nR, nC]);
                            queue.push([nR, nC]);
                        }
                    }
                }
            }

            if (matches.length >= 3) {
                matches.forEach(([r, c]) => grid[r][c].active = false);
                score += matches.length * 10;
                scoreElement.innerText = score;
            }
        }

        function getNeighbors(r, c) {
            const isOdd = r % 2 !== 0;
            return isOdd ? 
                [[r, c-1], [r, c+1], [r-1, c], [r-1, c+1], [r+1, c], [r+1, c+1]] : 
                [[r, c-1], [r, c+1], [r-1, c-1], [r-1, c], [r+1, c-1], [r+1, c]];
        }

        // 5. التحكم والتشغيل
        function createShooter() {
            shooterBall = { 
                x: canvas.width / 2, 
                y: canvas.height - 50, 
                color: COLORS[Math.floor(Math.random() * COLORS.length)] 
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isShooting) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const angle = Math.atan2(mouseY - shooterBall.y, mouseX - shooterBall.x);
            
            shooterBall = new Projectile(shooterBall.x, shooterBall.y, shooterBall.color, angle);
            isShooting = true;
        });

        // دعم اللمس للجوال
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const mouseX = touch.clientX - rect.left;
            const mouseY = touch.clientY - rect.top;
            const angle = Math.atan2(mouseY - (canvas.height - 50), mouseX - (canvas.width / 2));
            if (!isShooting) {
                shooterBall = new Projectile(canvas.width / 2, canvas.height - 50, shooterBall.color, angle);
                isShooting = true;
            }
        });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الشبكة
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].active) {
                        const { x, y } = getCoords(r, c);
                        drawBubble(x, y, grid[r][c].color);
                    }
                }
            }

            // رسم المقذوف أو المصوب
            if (isShooting) {
                shooterBall.update();
                shooterBall.draw();
                checkCollision();
            } else {
                drawBubble(shooterBall.x, shooterBall.y, shooterBall.color);
                
                // رسم سهم توجيه بسيط
                ctx.setLineDash([5, 10]);
                ctx.beginPath();
                ctx.moveTo(shooterBall.x, shooterBall.y);
                ctx.lineTo(shooterBall.x, shooterBall.y - 50);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.stroke();
                ctx.setLineDash([]);
            }

            requestAnimationFrame(update);
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = 0;
            gameOverScreen.style.display = 'none';
            initGrid();
            createShooter();
        }

        // البدء
        initGrid();
        createShooter();
        update();
    </script>
</body>
</html>
